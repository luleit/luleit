<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF Files Online Free - Luleit</title>
    <meta name="description" content="Merge multiple PDF files into one document online for free.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-500:#6b7280;--gray-800:#1f2937;--gray-900:#111827;--success:#16a34a;--font:'Inter',sans-serif}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--font);color:var(--gray-900);background:var(--gray-50);min-height:100vh}
        .header{background:white;border-bottom:1px solid var(--gray-200);padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--gray-900)}
        .logo-icon{width:40px;height:40px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:18px}
        .logo-text{font-size:24px;font-weight:700}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;font-size:15px;font-weight:600;font-family:var(--font);border-radius:10px;border:none;cursor:pointer;text-decoration:none;transition:all .2s}
        .btn-primary{background:var(--primary);color:white}
        .btn-primary:hover{background:var(--primary-dark)}
        .btn-secondary{background:white;color:var(--gray-800);border:1px solid var(--gray-200)}
        .container{max-width:800px;margin:0 auto;padding:60px 24px}
        .page-icon{width:80px;height:80px;background:var(--primary-light);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
        .page-icon svg{color:var(--primary)}
        h1{font-size:36px;font-weight:700;text-align:center;margin-bottom:12px}
        .subtitle{font-size:18px;color:var(--gray-500);text-align:center;margin-bottom:40px}
        .upload-box{background:white;border-radius:20px;padding:40px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
        .upload-zone{border:2px dashed var(--gray-200);border-radius:16px;padding:48px;text-align:center;cursor:pointer;transition:all .2s}
        .upload-zone:hover{border-color:var(--primary);background:var(--primary-light)}
        .file-list{margin-top:24px}
        .file-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--gray-50);border-radius:10px;margin-bottom:8px}
        .file-item-name{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
        .file-item-remove{background:none;border:none;color:var(--gray-500);cursor:pointer;padding:4px}
        .merge-btn{margin-top:24px;width:100%;padding:16px}
        .loading{display:none;position:fixed;inset:0;background:rgba(255,255,255,.95);z-index:1000;align-items:center;justify-content:center;flex-direction:column;gap:16px}
        .loading.show{display:flex}
        .spinner{width:40px;height:40px;border:3px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo"><div class="logo-icon">L</div><span class="logo-text">Luleit</span></a>
        <a href="/" class="btn btn-secondary">All Tools</a>
    </header>
    
    <div class="container">
        <div class="page-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="8" y="14" width="8" height="7"/></svg>
        </div>
        <h1>Merge PDF Files</h1>
        <p class="subtitle">Combine multiple PDFs into a single document</p>
        
        <div class="upload-box">
            <div class="upload-zone" id="uploadZone">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" style="margin-bottom:16px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <p style="font-weight:500;margin-bottom:8px">Drop PDF files here or click to browse</p>
                <p style="font-size:13px;color:var(--gray-500)">Select multiple files to merge</p>
            </div>
            <input type="file" id="fileInput" accept=".pdf" multiple hidden>
            
            <div class="file-list" id="fileList"></div>
            
            <button class="btn btn-primary merge-btn" id="mergeBtn" style="display:none">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="8" y="14" width="8" height="7"/></svg>
                Merge PDFs
            </button>
        </div>
    </div>
    
    <div class="loading" id="loading"><div class="spinner"></div><div>Merging PDFs...</div></div>
    
    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const mergeBtn = document.getElementById('mergeBtn');
        const loading = document.getElementById('loading');
        let files = [];
        
        uploadZone.onclick = () => fileInput.click();
        uploadZone.ondragover = e => { e.preventDefault(); uploadZone.style.borderColor = 'var(--primary)'; };
        uploadZone.ondragleave = () => { uploadZone.style.borderColor = ''; };
        uploadZone.ondrop = e => { e.preventDefault(); uploadZone.style.borderColor = ''; addFiles(e.dataTransfer.files); };
        fileInput.onchange = e => addFiles(e.target.files);
        
        function addFiles(newFiles) {
            for (const f of newFiles) {
                if (f.type === 'application/pdf') files.push(f);
            }
            renderFiles();
        }
        
        function renderFiles() {
            fileList.innerHTML = files.map((f, i) => `
                <div class="file-item">
                    <span class="file-item-name">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        ${f.name}
                    </span>
                    <button class="file-item-remove" onclick="removeFile(${i})">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            `).join('');
            mergeBtn.style.display = files.length >= 2 ? 'flex' : 'none';
        }
        
        window.removeFile = i => { files.splice(i, 1); renderFiles(); };
        
        mergeBtn.onclick = async () => {
            if (files.length < 2) return;
            loading.classList.add('show');
            
            const formData = new FormData();
            files.forEach(f => formData.append('files', f));
            
            try {
                const res = await fetch('/api/merge', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.success) {
                    const tokenForm = new FormData();
                    tokenForm.append('file_id', data.fileId);
                    tokenForm.append('payment_intent_id', 'free');
                    const tokenRes = await fetch('/api/verify-payment', { method: 'POST', body: tokenForm }).then(r => r.json());
                    window.location.href = '/api/download/' + tokenRes.token;
                }
            } catch (e) {
                alert('Merge failed');
            }
            loading.classList.remove('show');
        };
    </script>
</body>
</html>
