<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compress PDF Online Free - Luleit</title>
    <meta name="description" content="Reduce PDF file size online for free while maintaining quality.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-500:#6b7280;--gray-800:#1f2937;--success:#16a34a;--font:'Inter',sans-serif}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--font);color:var(--gray-800);background:var(--gray-50);min-height:100vh}
        .header{background:white;border-bottom:1px solid var(--gray-200);padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between}
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--gray-800)}
        .logo-icon{width:40px;height:40px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:18px}
        .logo-text{font-size:24px;font-weight:700}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;font-size:15px;font-weight:600;font-family:var(--font);border-radius:10px;border:none;cursor:pointer;text-decoration:none;transition:all .2s}
        .btn-primary{background:var(--primary);color:white}
        .btn-primary:hover{background:var(--primary-dark)}
        .btn-secondary{background:white;color:var(--gray-800);border:1px solid var(--gray-200)}
        .btn-success{background:var(--success);color:white}
        .container{max-width:800px;margin:0 auto;padding:60px 24px}
        .page-icon{width:80px;height:80px;background:var(--primary-light);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
        .page-icon svg{color:var(--primary)}
        h1{font-size:36px;font-weight:700;text-align:center;margin-bottom:12px}
        .subtitle{font-size:18px;color:var(--gray-500);text-align:center;margin-bottom:40px}
        .upload-box{background:white;border-radius:20px;padding:40px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
        .upload-zone{border:2px dashed var(--gray-200);border-radius:16px;padding:48px;text-align:center;cursor:pointer;transition:all .2s}
        .upload-zone:hover{border-color:var(--primary);background:var(--primary-light)}
        .result{display:none;text-align:center;padding:32px}
        .result-icon{width:64px;height:64px;background:var(--success);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
        .result-icon svg{color:white}
        .result h2{font-size:24px;font-weight:600;margin-bottom:24px}
        .stats{display:flex;justify-content:center;gap:40px;margin-bottom:32px}
        .stat{text-align:center}
        .stat-value{font-size:28px;font-weight:700;color:var(--primary)}
        .stat-label{font-size:13px;color:var(--gray-500);margin-top:4px}
        .loading{display:none;position:fixed;inset:0;background:rgba(255,255,255,.95);z-index:1000;align-items:center;justify-content:center;flex-direction:column;gap:16px}
        .loading.show{display:flex}
        .spinner{width:40px;height:40px;border:3px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo"><div class="logo-icon">L</div><span class="logo-text">Luleit</span></a>
        <a href="/" class="btn btn-secondary">All Tools</a>
    </header>
    
    <div class="container">
        <div class="page-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </div>
        <h1>Compress PDF</h1>
        <p class="subtitle">Reduce file size while maintaining quality</p>
        
        <div class="upload-box">
            <div class="upload-zone" id="uploadZone">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" style="margin-bottom:16px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <p style="font-weight:500;margin-bottom:8px">Drop your PDF here or click to browse</p>
                <p style="font-size:13px;color:var(--gray-500)">Maximum file size: 100MB</p>
            </div>
            <input type="file" id="fileInput" accept=".pdf" hidden>
            
            <div class="result" id="result">
                <div class="result-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                <h2>Compression Complete!</h2>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value" id="originalSize">0 MB</div>
                        <div class="stat-label">Original</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="compressedSize">0 MB</div>
                        <div class="stat-label">Compressed</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="reduction">0%</div>
                        <div class="stat-label">Reduced</div>
                    </div>
                </div>
                <button class="btn btn-success" id="downloadBtn" style="padding:16px 48px">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download
                </button>
            </div>
        </div>
    </div>
    
    <div class="loading" id="loading"><div class="spinner"></div><div>Compressing PDF...</div></div>
    
    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const result = document.getElementById('result');
        const loading = document.getElementById('loading');
        let downloadToken = null;
        
        uploadZone.onclick = () => fileInput.click();
        uploadZone.ondragover = e => { e.preventDefault(); uploadZone.style.borderColor = 'var(--primary)'; };
        uploadZone.ondragleave = () => { uploadZone.style.borderColor = ''; };
        uploadZone.ondrop = e => { e.preventDefault(); uploadZone.style.borderColor = ''; if(e.dataTransfer.files[0]?.type === 'application/pdf') compress(e.dataTransfer.files[0]); };
        fileInput.onchange = e => { if(e.target.files[0]) compress(e.target.files[0]); };
        
        async function compress(file) {
            loading.classList.add('show');
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('quality', 'medium');
            
            try {
                const res = await fetch('/api/compress', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('originalSize').textContent = formatSize(data.originalSize);
                    document.getElementById('compressedSize').textContent = formatSize(data.compressedSize);
                    document.getElementById('reduction').textContent = data.reduction + '%';
                    
                    const tokenForm = new FormData();
                    tokenForm.append('file_id', data.fileId);
                    tokenForm.append('payment_intent_id', 'free');
                    const tokenRes = await fetch('/api/verify-payment', { method: 'POST', body: tokenForm }).then(r => r.json());
                    downloadToken = tokenRes.token;
                    
                    uploadZone.style.display = 'none';
                    result.style.display = 'block';
                }
            } catch (e) {
                alert('Compression failed');
            }
            loading.classList.remove('show');
        }
        
        document.getElementById('downloadBtn').onclick = () => {
            if (downloadToken) window.location.href = '/api/download/' + downloadToken;
        };
        
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }
    </script>
</body>
</html>
